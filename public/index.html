<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V-CODE</title>
<style>
*{box-sizing:border-box}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 color:#fff;
 background:
 radial-gradient(circle at 15% 10%,rgba(0,220,255,.20),transparent 28%),
 radial-gradient(circle at 85% 20%,rgba(130,60,255,.22),transparent 30%),
 linear-gradient(135deg,#05050b,#0b1020 50%,#05050b);
 overflow-x:hidden;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.025),transparent 65%);
}

header{
 position:relative;
 text-align:center;
 padding:38px 20px 25px;
}

header h1{
 margin:0;
 font-size:52px;
 font-weight:900;
 letter-spacing:6px;
 background:linear-gradient(90deg,#fff,#67e8ff,#a78bfa,#fff);
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
 text-shadow:0 0 35px rgba(80,220,255,.25);
}

header p{
 margin:8px 0 0;
 color:#9da5bb;
 font-size:14px;
 letter-spacing:2px;
}

header:after{
 content:"Developed by Vetho";
 position:absolute;
 right:15px;
 top:12px;
 font-size:11px;
 color:#8f9ab3;
 letter-spacing:.5px;
}

.page{
 display:none;
 max-width:520px;
 margin:auto;
 padding:12px 18px 40px;
 animation:show .35s ease;
}

.active{display:block}

@keyframes show{
 from{opacity:0;transform:translateY(12px)}
 to{opacity:1;transform:translateY(0)}
}

.card{
 position:relative;
 background:rgba(18,22,38,.78);
 border:1px solid rgba(255,255,255,.09);
 backdrop-filter:blur(18px);
 -webkit-backdrop-filter:blur(18px);
 padding:22px;
 border-radius:24px;
 margin-bottom:16px;
 box-shadow:0 18px 50px rgba(0,0,0,.35);
}

.card h2{
 margin-top:4px;
 font-size:25px;
}

.card h3{
 font-size:20px;
}

button,input,textarea{
 width:100%;
 padding:15px 16px;
 margin:7px 0;
 border:1px solid rgba(255,255,255,.08);
 border-radius:15px;
 font-size:16px;
 outline:none;
 transition:.2s;
}

input,textarea{
 background:rgba(255,255,255,.06);
 color:#fff;
}

input::placeholder,textarea::placeholder{
 color:#778096;
}

textarea{
 min-height:110px;
 resize:vertical;
}

button{
 cursor:pointer;
 font-weight:800;
 color:white;
 background:rgba(255,255,255,.07);
}

button:active{
 transform:scale(.97);
}

.primary{
 color:#061018;
 border:0;
 background:linear-gradient(135deg,#67e8ff,#8b5cf6);
 box-shadow:0 8px 25px rgba(90,180,255,.2);
}

.primary:hover{
 filter:brightness(1.1);
}

.secondary{
 background:rgba(255,255,255,.06);
 color:#dbe5ff;
}

.code{
 text-align:center;
 font-size:31px;
 font-weight:900;
 letter-spacing:4px;
 margin:20px 0;
 padding:17px;
 border-radius:17px;
 background:linear-gradient(135deg,rgba(103,232,255,.12),rgba(139,92,246,.15));
 border:1px solid rgba(103,232,255,.18);
 color:#8ff1ff;
}

.result{
 display:none;
}

.profile{
 background:rgba(255,255,255,.045);
 border:1px solid rgba(255,255,255,.07);
 padding:20px;
 border-radius:18px;
 line-height:1.7;
}

.profile b{
 font-size:22px;
 color:#8ff1ff;
}

#mediaBox{
 background:rgba(255,255,255,.035);
 border:1px solid rgba(255,255,255,.07);
 padding:15px;
 border-radius:18px;
}

#mediaBox input{
 padding:10px;
 font-size:14px;
}

#qrBox{
 background:white;
 border-radius:20px;
 padding:15px;
 color:#111;
 box-shadow:0 10px 35px rgba(0,0,0,.3);
}

#qrCanvas{
 max-width:100%;
 height:auto;
}

small{
 color:#8f9ab3;
}

@media(max-width:480px){
 header h1{
  font-size:43px;
 }
 header{
  padding-top:45px;
 }
 .card{
  padding:18px;
 }
}
</style>
<script src="qrcode.min.js"></script>
</head>

<body>

<header>
<h1>V-CODE</h1>
<p>Create • Find • Connect</p>
</header>

<section id="home" class="page active">
<div class="card">
<h2>Welcome 👋</h2>
<button class="primary" onclick="page('create')">✨ Create V-Code</button>
<button class="primary" onclick="page('find')">🔎 Find V-Code</button>
<button class="primary" onclick="page('scan')">📷 Scan QR</button>
</div>
</section>

<section id="create" class="page">
<div class="card">
<button class="secondary" onclick="page('home')">← Home</button>
<h2>✨ Create V-Code</h2>
<input id="name" placeholder="Your name">
<textarea id="message" placeholder="Your message"></textarea>
<button class="primary" onclick="create()">Generate</button>
</div>

<div id="created" class="card result">
<h3>Your V-Code</h3>
<div id="newcode" class="code"></div>
<p id="newinfo"></p>
<button class="primary" onclick="copyCode()">Copy Code</button>
</div>
</section>

<section id="find" class="page">
<div class="card">
<button class="secondary" onclick="page('home')">← Home</button>
<h2>🔎 Find V-Code</h2>
<input id="search" placeholder="V-ABC123">
<button class="primary" onclick="find()">Find</button>
</div>
<div id="found" class="card result">
<h2>👤 Profile</h2>
<div class="profile">
<b id="fname"></b><br><br>
<span id="fmessage"></span><br><br>
<small id="fcode"></small>
</div>
</div>
</section>

<section id="scan" class="page">
<div class="card">
<button class="secondary" onclick="page('home')">← Home</button>
<h2>📷 Scan QR</h2>
<p>QR scanner will be added in the next APK build.</p>
</div>
</section>

<script>
function page(id){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

function database(){
 return JSON.parse(localStorage.getItem('vcodeDB')||'{}');
}

function addMediaUI(){
 const message=document.getElementById('message');
 if(!message || document.getElementById('mediaBox')) return;

 const box=document.createElement('div');
 box.id='mediaBox';
 box.style.margin='12px 0';
 box.innerHTML=`
   <label style="display:block;margin:8px 0;font-weight:bold">
     🖼️ Add Picture
     <input id="pic" type="file" accept="image/*" style="display:block;margin-top:6px">
   </label>

   <label style="display:block;margin:8px 0;font-weight:bold">
     🎥 Add Video
     <input id="vid" type="file" accept="video/*" style="display:block;margin-top:6px">
   </label>

   <small id="mediaStatus">No media selected</small>
 `;
 message.parentNode.insertBefore(box,message.nextSibling);
}

document.addEventListener('DOMContentLoaded',addMediaUI);

function readFile(file){
 return new Promise((resolve,reject)=>{
   if(!file){resolve(null);return;}
   const reader=new FileReader();
   reader.onload=()=>resolve({
     name:file.name,
     type:file.type,
     data:reader.result
   });
   reader.onerror=reject;
   reader.readAsDataURL(file);
 });
}

async function create(){
 const name=document.getElementById('name').value.trim();
 const message=document.getElementById('message').value.trim();

 if(!name)return alert('Enter your name');

 const pic=document.getElementById('pic')?.files[0];
 const vid=document.getElementById('vid')?.files[0];

 if(pic && pic.size > 3000000)
   return alert('Picture is too large. Use an image under 3 MB.');

 if(vid && vid.size > 8000000)
   return alert('Video is too large. Use a video under 8 MB.');

 const status=document.getElementById('mediaStatus');
 if(status) status.textContent='Saving...';

 try{
   const code='V-'+Math.random().toString(36).substring(2,8).toUpperCase();

   const db=database();

   db[code]={
     name:name,
     message:message,
     createdAt:Date.now()
   };

   localStorage.setItem('vcodeDB',JSON.stringify(db));

   await saveMedia(code,pic,vid);

   document.getElementById('created').style.display='block';
   document.getElementById('newcode').textContent=code;
   document.getElementById('newinfo').textContent='Created for '+name;

   let qrBox=document.getElementById('qrBox');

   if(!qrBox){
     qrBox=document.createElement('div');
     qrBox.id='qrBox';
     qrBox.style.cssText='text-align:center;margin:18px 0;';
     document.getElementById('created').appendChild(qrBox);
   }

   qrBox.innerHTML='<b>Scan this QR Code</b><br><canvas id="qrCanvas" style="margin-top:10px;background:white;padding:8px;border-radius:10px"></canvas>';

   if(window.QRCode && QRCode.toCanvas){
     QRCode.toCanvas(
       document.getElementById('qrCanvas'),
       code,
       {
         width:220,
         margin:2,
         errorCorrectionLevel:'M'
       }
     );
   }

   if(status) status.textContent='Media saved ✓';

 }catch(e){
   console.error(e);
   alert('Could not save. Please try again.');
 }
}

function openMediaDB(){
 return new Promise((resolve,reject)=>{
   const request=indexedDB.open('VCodeMediaDB',1);

   request.onupgradeneeded=function(){
     const db=request.result;
     if(!db.objectStoreNames.contains('media')){
       db.createObjectStore('media');
     }
   };

   request.onsuccess=function(){
     resolve(request.result);
   };

   request.onerror=function(){
     reject(request.error);
   };
 });
}

async function saveMedia(code,pic,vid){
 const db=await openMediaDB();

 return new Promise((resolve,reject)=>{
   const tx=db.transaction('media','readwrite');
   const store=tx.objectStore('media');

   const request=store.put({
     picture:pic || null,
     video:vid || null
   },code);

   request.onsuccess=()=>resolve();
   request.onerror=()=>reject(request.error);

   setTimeout(()=>{
     reject(new Error('Media storage timeout'));
   },10000);
 });
}

async function getMedia(code){
 const db=await openMediaDB();

 return new Promise((resolve,reject)=>{
   const tx=db.transaction('media','readonly');
   const request=tx.objectStore('media').get(code);

   request.onsuccess=()=>resolve(request.result || {});
   request.onerror=()=>reject(request.error);
 });
}

async function find(){
 const code=document.getElementById('search').value
 .replace(/\s/g,'').toUpperCase();

 const db=database();
 const data=db[code];

 if(!data)return alert('V-Code not found');

 document.getElementById('found').style.display='block';
 document.getElementById('fname').textContent=data.name;
 document.getElementById('fmessage').textContent=data.message||'No message';
 document.getElementById('fcode').textContent=code;

 let old=document.getElementById('foundMedia');
 if(old) old.remove();

 const media=document.createElement('div');
 media.id='foundMedia';
 media.style.marginTop='15px';

 try{
   const mediaData=await getMedia(code);

   if(mediaData.picture){
     const title=document.createElement('p');
     title.textContent='🖼️ Picture';
     title.style.fontWeight='bold';

     const img=document.createElement('img');
     img.src=URL.createObjectURL(mediaData.picture);
     img.style.width='100%';
     img.style.maxWidth='500px';
     img.style.maxHeight='500px';
     img.style.objectFit='contain';
     img.style.borderRadius='12px';
     img.style.display='block';

     media.appendChild(title);
     media.appendChild(img);
   }

   if(mediaData.video){
     const title=document.createElement('p');
     title.textContent='🎥 Video';
     title.style.fontWeight='bold';

     const video=document.createElement('video');
     video.src=URL.createObjectURL(mediaData.video);
     video.controls=true;
     video.style.width='100%';
     video.style.maxHeight='400px';
     video.style.borderRadius='12px';

     media.appendChild(title);
     media.appendChild(video);
   }

   if(!mediaData.picture && !mediaData.video){
     media.innerHTML='<p>No media attached to this V-Code.</p>';
   }

 }catch(e){
   console.error(e);
   media.innerHTML='<p>Could not load media.</p>';
 }

 document.getElementById('found').appendChild(media);
}

function copyCode(){
 navigator.clipboard.writeText(
 document.getElementById('newcode').textContent
 );
 alert('Copied!');
}
</script>

</body>
</html>
